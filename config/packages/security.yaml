security:
    # Gestion des mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # Chargement des utilisateurs depuis la base de données
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Configuration des firewalls
    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Authentification
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_evenement

            # Déconnexion
            logout:
                path: app_logout
                target: app_login

    # Gestion des autorisations
    access_control:
        # Pages publiques
        - { path: "^/login$", roles: PUBLIC_ACCESS }
        - { path: "^/registration$", roles: PUBLIC_ACCESS }

        # Inscription à un événement : User connecté
        - { path: "^/evenement/[0-9]+/inscription$", roles: ROLE_USER }

        # Gestion des catégories : Admin uniquement
        - { path: "^/categorie", roles: ROLE_ADMIN }

        # Ajouter un événement : Admin uniquement
        - { path: "^/evenement/ajouter$", roles: ROLE_ADMIN }

        # Modifier un événement : Admin uniquement
        - { path: "^/evenement/[0-9]+/modifier$", roles: ROLE_ADMIN }

        # Supprimer un événement : Admin uniquement
        - { path: "^/evenement/[0-9]+/supprimer$", roles: ROLE_ADMIN }

        # Liste des participants : Admin uniquement
        - { path: "^/evenement/[0-9]+/inscriptions$", roles: ROLE_ADMIN }

        # Consultation des événements : User connecté
        - { path: "^/evenement", roles: ROLE_USER }

        # Consultation des inscriptions : User connecté
        - { path: "^/inscription", roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
